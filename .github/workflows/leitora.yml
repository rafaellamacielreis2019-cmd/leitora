      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar
        working-directory: leitora
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Publicar link de download
        working-directory: leitora
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Leitora.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Leitora.apk --title "Leitora - baixar APK" --notes "Toque em Leitora.apk para baixar. Build ${{ github.run_number }}." --target "${{ github.sha }}"

      - name: Mostrar erro
        if: failure()
        working-directory: leitora
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          grep -E "^e: |error:|What went wrong|Could not|FAILED|Exception" build.log | head -40 > erro.txt || true
          cat erro.txt
          gh release delete erro --yes --cleanup-tag || true
          gh release create erro erro.txt --title "Erro na compilacao" --notes-file erro.txt --target "${{ github.sha }}" || true
